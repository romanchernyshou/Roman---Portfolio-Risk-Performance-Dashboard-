[project]
name = "portfolio-dashboard"
version = "0.1.0"
description = "Streamlit portfolio analytics dashboard: returns, benchmarking, concentration, volatility, drawdowns, correlation."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
